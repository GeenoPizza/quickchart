    <div id="cvMainMeasures"></div>
    <div id="cvSequence" class="cv-sequence"></div>
    <div id="cvBlocks"></div>
    <div style="margin-top:20px; text-align:center;" class="brand-credit">
      Prodotto da <a href="https://www.batterista.online" target="_blank" style="color:var(--teal); text-decoration:none; font-weight:bold;">www.batterista.online</a>
    </div>
  `;

  applyLogo();
  const cvContentWidth = Math.max(260, (cv.clientWidth || 900) - 14);

  const mainHost = document.getElementById("cvMainMeasures");
  (showMain ? chart.mainGroove.measures : []).forEach((grid, mIdx)=>{
    const box = document.createElement("div");
    box.className = "notation-box";
    box.style.marginBottom = "8px";
    box.style.overflowX = "visible";
    const inner = document.createElement("div");
    inner.id = "cv-main-notation-" + mIdx;
    box.appendChild(inner);
    mainHost.appendChild(box);
    const measured = inner.clientWidth;
    const w = measured > 40 ? measured - 4 : cvContentWidth;
    drawGrid(inner.id, grid, w, chart.timeSig, mIdx===0, true);
  });

  const seqHost = document.getElementById("cvSequence");
  if(!chart.blocks.length){
    seqHost.style.display = "none";
  } else {
    seqHost.style.display = "flex";
    seqHost.innerHTML = chart.blocks.map((block,i)=>{
      const cfg = blockCfg(block);
      const chip = `<div class="cv-seq-chip${liveCurrentId === block.id ? " current" : ""}${liveNextId === block.id ? " next" : ""}" data-id="${block.id}" style="background:${cfg.color}; color:${cfg.text};">${escapeHtml(cfg.label)}</div>`;
      return i === 0 ? chip : `<div class="cv-seq-arrow">→</div>${chip}`;
    }).join("");
  }

  const blocksHost = document.getElementById("cvBlocks");
  if(!chart.blocks.length){
    blocksHost.innerHTML = '<div class="empty-state">Nessun blocco definito.</div>';
  } else {
    blocksHost.innerHTML = "";
    chart.blocks.forEach(block=>{
      const cfg = blockCfg(block);
      const div = document.createElement("div");
      div.className = "cv-block" + (liveCurrentId === block.id ? " current" : "") + (liveNextId === block.id ? " next" : "");
      div.dataset.id = block.id;
      div.addEventListener("click", ()=>{
        liveCurrentId = (liveCurrentId === block.id) ? null : block.id;
        const cvEl = document.getElementById("chartView");
        cvEl.classList.toggle("has-current", !!liveCurrentId);
        cvEl.querySelectorAll(".cv-block, .cv-seq-chip").forEach(el=>el.classList.toggle("current", el.dataset.id === liveCurrentId));
      });
      div.style.background = cfg.color;
      div.style.color = cfg.text;
      const barsDisplay = block.bars === "-" ? "<b>—</b>" : `<b>${block.bars}</b><small>battute</small>`;
      div.innerHTML = `
        <div class="cv-block-top">
          <span class="cv-badge">${escapeHtml(cfg.label)}</span>
          <span class="cv-bars">${barsDisplay}</span>
        </div>
        ${block.notes ? `<div class="cv-notes">${escapeHtml(block.notes)}</div>` : ""}
      `;
      blocksHost.appendChild(div);
      if(block.gridEnabled && block.groove && block.groove.measures.length && !grooveIsEmpty(block.groove)){
        const isTwoCol = block.groove.measures.length >= 2;
        const fallbackWidth = isTwoCol ? Math.round((cvContentWidth-40)/2) : cvContentWidth-32;
        const miniWrap = document.createElement("div");
        miniWrap.className = "cv-mini-notation-wrap" + (isTwoCol ? " two-col" : "");
        const innerEls = [];
        block.groove.measures.forEach((grid, mIdx)=>{
          const box = document.createElement("div");
          box.className = "notation-box";
          const inner = document.createElement("div");
          inner.id = "cv-mini-" + block.id + "-" + mIdx;
          box.appendChild(inner);
          miniWrap.appendChild(box);
          innerEls.push(inner);
        });
        div.appendChild(miniWrap);
        block.groove.measures.forEach((grid, mIdx)=>{
          const measured = innerEls[mIdx].clientWidth;
          const w = measured > 40 ? measured - 4 : fallbackWidth;
          drawGrid("cv-mini-" + block.id + "-" + mIdx, grid, w, chart.timeSig, mIdx === 0, true);
        });
      }
    });
  }
}

function updateNavLabel() {

function navigateChart(direction) {
  const idx = getChartIndex();
  const total = getChartCount();
  if(total <= 1) return;
  stopPlayback();
  metroStop();
  let newIdx = (idx + direction + total) % total;
  state.currentId = state.charts[newIdx].id;
  liveCurrentId = null; liveNextId = null;
  saveState();
  if(qcdRoot.classList.contains("live")) {
    updateChartView();
    document.getElementById("chartViewOuter").scrollTop = 0;
  } else {
    renderEditor();
    renderSidebar();
  }
}

function filenameFor(chart){
  const base = (chart.title || "drum-chart").replace(/[^a-z0-9]+/gi,"_").toLowerCase();
  const artist = (chart.artist || "").replace(/[^a-z0-9]+/gi,"_").toLowerCase();
  return artist ? `${base}_${artist}` : base;
}

function refreshBackupInfo(){
  const el = document.getElementById("backupInfo");
  if(!el) return;
  let ts = 0;
  try{ ts = parseInt(localStorage.getItem("qcd_last_backup"), 10) || 0; }catch(e){}
  let txt, stale = false;
  if(!ts){ txt = "Nessun backup ancora: salva la SetList per non perdere le chart."; stale = true; }
  else {
    const d = Math.floor((Date.now() - ts) / 86400000);
    txt = "Ultimo backup: " + (d <= 0 ? "oggi" : d === 1 ? "ieri" : d + " giorni fa");
    stale = d >= 7;
    if(stale) txt += ". Conviene rifarlo.";
  }
  el.textContent = txt;
  el.classList.toggle("stale", stale);
}

// Salva la SetList: dal telefono apre il menu Condividi (File, iCloud, Drive...), altrimenti scarica il file
async function exportJSON(){
  const dataStr = JSON.stringify(state, null, 2);
  const d = new Date();
  const stamp = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const fname = "quickchart-drummer-setlist-" + stamp + ".json";
  let done = false;
  try{
    const file = new File([dataStr], fname, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
      await navigator.share({files:[file], title:"QuickChart Drummer - SetList"});
      done = true;
    }
  }catch(err){
    if(err && err.name === "AbortError") return;   // annullato dall'utente: non conta come backup
  }
  if(!done){
    const blob = new Blob([dataStr], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }
  try{ localStorage.setItem("qcd_last_backup", String(Date.now())); }catch(e){}
  refreshBackupInfo();
}

function importJSON(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !Array.isArray(parsed.charts)) throw new Error("Formato non valido");
      const existingIds = new Set(state.charts.map(c=>c.id));
      parsed.charts.forEach(c=>{ if(existingIds.has(c.id)) c.id = uid(); state.charts.push(migrateChart(c)); });
      state.currentId = parsed.charts.length ? parsed.charts[parsed.charts.length-1].id : state.currentId;
      saveState(); renderSidebar(); renderEditor();
      alert("SetList caricata con successo.");
    }catch(err){
      alert("Errore durante il caricamento: file non valido.");
      console.error(err);
    }
  };
  reader.readAsText(file);
}

// Cattura la vista chart e, insieme all'immagine, le posizioni verticali delle sezioni
// (in pixel del canvas) così il PDF può andare a capo solo tra una sezione e l'altra.
async function captureLiveCanvas(){
  if(typeof html2canvas === "undefined") throw new Error("html2canvas non disponibile");
  const wasLive = qcdRoot.classList.contains("live");
  if(!wasLive){ qcdRoot.classList.add("live"); updateChartView(); }
  try{
    await new Promise(r=>setTimeout(r, 200));
    const node = document.getElementById("chartView");
    const SCALE = 2;
    const nodeTop = node.getBoundingClientRect().top;
    const units = [];
    Array.from(node.children).forEach(ch=>{
      if(ch.id === "cvBlocks" || ch.id === "cvMainMeasures"){ Array.from(ch.children).forEach(c=>units.push(c)); }
      else units.push(ch);
    });
    const ranges = units.map(u=>{
      const r = u.getBoundingClientRect();
      return { top:(r.top - nodeTop)*SCALE, bottom:(r.bottom - nodeTop)*SCALE };
    }).filter(r=>r.bottom > r.top);
    // la sezione "corrente" e lo sbiadimento valgono solo a schermo: PNG e PDF escono puliti
    const hadFocus = node.classList.contains("has-current");
    node.classList.remove("has-current");
    node.querySelectorAll(".current").forEach(el=>el.classList.add("_cur"));
    node.querySelectorAll("._cur").forEach(el=>el.classList.remove("current"));
    let canvas;
    try{ canvas = await html2canvas(node, { backgroundColor:"#0A0B0C", scale:SCALE, useCORS:true }); }
    finally{
      node.querySelectorAll("._cur").forEach(el=>{ el.classList.remove("_cur"); el.classList.add("current"); });
      if(hadFocus) node.classList.add("has-current");
    }
    canvas._units = ranges;
    return canvas;
  } finally {
    if(!wasLive) qcdRoot.classList.remove("live");
  }
}

async function exportPNG(){
  const chart = getCurrentChart();

}

// Punti di interruzione pagina: sempre all'inizio di una sezione.
// Una sezione che non entra nello spazio rimasto passa alla pagina successiva.
function computePageBreaks(units, totalH, pageH){
  const breaks = [0];
  let start = 0;
  while(totalH - start > pageH){
    const limit = start + pageH;
    let cut = null;
    units.forEach(u=>{ if(u.top > start + 1 && u.top <= limit) cut = u.top; });
    if(cut === null) cut = limit; // sezione più alta di una pagina: taglio forzato
    breaks.push(cut);
    start = cut;
  }
  breaks.push(totalH);
  return breaks;
}

async function exportPDF(){
  const chart = getCurrentChart();
  if(!chart) return;
  try{
    const canvas = await captureLiveCanvas();

    if(typeof window.jspdf !== "undefined"){
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('portrait', 'mm', 'a4');
      const pageW = pdf.internal.pageSize.getWidth();
      const pageHmm = pdf.internal.pageSize.getHeight();
      const margin = 8;
      const contentW = pageW - margin*2;
      const mmPerPx = contentW / canvas.width;
      const pageHpx = Math.floor((pageHmm - margin*2) / mmPerPx);
      const breaks = computePageBreaks(canvas._units || [], canvas.height, pageHpx);

      for(let p=0; p<breaks.length-1; p++){
        const y0 = Math.round(breaks[p]);
        const h = Math.max(1, Math.round(breaks[p+1] - breaks[p]));
        const slice = document.createElement("canvas");
        slice.width = canvas.width; slice.height = h;
        const sctx = slice.getContext("2d");
        sctx.fillStyle = "#0A0B0C";
        sctx.fillRect(0, 0, slice.width, slice.height);
        sctx.drawImage(canvas, 0, y0, canvas.width, h, 0, 0, canvas.width, h);
        if(p > 0) pdf.addPage();
        pdf.setFillColor(10, 11, 12);
        pdf.rect(0, 0, pageW, pageHmm, 'F');
        pdf.addImage(slice.toDataURL("image/jpeg", 0.95), 'JPEG', margin, margin, contentW, h * mmPerPx);
      }
      pdf.save(filenameFor(chart) + '.pdf');
    } else {
      window.print();
    }
  }catch(err){
    console.error(err);
    alert("Errore nella generazione del PDF. Riprova con Stampa / PDF.");
  }
}

/* ============================ METRONOMO (LIVE) ============================ */
let liveNextId = null;
let metroCountIn = 1;
try{ const v = parseInt(localStorage.getItem("qcd_countin"), 10); if(!isNaN(v)) metroCountIn = Math.max(0, Math.min(8, v)); }catch(e){}
const metro = { on:false, timer:null, uiTimers:[], bars:[], bar:0, beat:0, nextT:0, lastScroll:null };

function metroInfo(t){ const e = document.getElementById("metroInfo"); if(e) e.textContent = t; }

function metroClick(t, accent){
  const ctx = getAudioCtx();
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "square"; o.frequency.value = accent ? 1600 : 1000;
  g.gain.setValueAtTime(accent ? 0.5 : 0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + 0.06);
}

// Evidenzia la sezione corrente e (nell'ultima battuta) quella successiva
function metroSetLive(cur, next){
  liveCurrentId = cur; liveNextId = next;
  const cv = document.getElementById("chartView");
  if(!cv) return;
  cv.classList.toggle("has-current", !!(cur || next));
  cv.querySelectorAll(".cv-block, .cv-seq-chip").forEach(el=>{
    el.classList.toggle("current", el.dataset.id === cur);
    el.classList.toggle("next", el.dataset.id === next);
  });
  const target = next || cur;
  if(target && target !== metro.lastScroll){
    metro.lastScroll = target;
    const el = cv.querySelector('.cv-block[data-id="' + target + '"]');
    if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
  }
}

function metroStop(){
  const was = metro.on;
  if(metro.timer) clearInterval(metro.timer);
  metro.timer = null;
  metro.uiTimers.forEach(clearTimeout); metro.uiTimers = [];
  metro.on = false; metro.lastScroll = null;
  const b = document.getElementById("btnMetro");
  if(b){ b.textContent = "Metronomo"; b.classList.remove("playing"); }
  metroInfo("");
  if(was && qcdRoot.classList.contains("live")) metroSetLive(null, null);
}

function metroShow(idx, beat){
  const chart = getCurrentChart();
  const bar = metro.bars[idx];
  if(!chart || !bar) return;
  if(bar.ci){
    if(beat === 0){ const first = metro.bars.find(x=>!x.ci); metroSetLive(null, first ? first.id : null); }
    metroInfo("Attacco " + bar.i + "/" + bar.n + " · " + (beat + 1));
    return;
  }
  const blk = chart.blocks.find(b=>b.id === bar.id);
  if(beat === 0){
    let next = null;
    if(bar.i === bar.n){ const nb = metro.bars.slice(idx + 1).find(x=>x.id !== bar.id); next = nb ? nb.id : null; }
    metroSetLive(bar.id, next);
  }
  metroInfo((blk ? blockCfg(blk).label : "") + " " + bar.i + "/" + bar.n + " · " + (beat + 1));
}

function metroTick(){
  if(!metro.on) return;
  const ctx = getAudioCtx();
  const chart = getCurrentChart();
  if(!chart){ metroStop(); return; }
  const beats = timeSigMeta(chart.timeSig).beats;
  while(metro.nextT < ctx.currentTime + 0.15){
    if(metro.bar >= metro.bars.length){
      clearInterval(metro.timer); metro.timer = null;
      metro.uiTimers.push(setTimeout(metroStop, Math.max(0, (metro.nextT - ctx.currentTime) * 1000)));
      return;
    }
    const idx = metro.bar, beat = metro.beat, t = metro.nextT;
    metroClick(t, beat === 0);
    metro.uiTimers.push(setTimeout(()=>{ if(metro.on) metroShow(idx, beat); }, Math.max(0, (t - ctx.currentTime) * 1000)));
    metro.nextT += 60 / Math.max(20, chart.bpm || 120);   // il BPM si riferisce al movimento del metro
    if(++metro.beat >= beats){ metro.beat = 0; metro.bar++; }
  }
}

function metroStart(){
  const chart = getCurrentChart();
  if(!chart) return;
  stopPlayback();
  const bars = [];
  for(let i = 1; i <= metroCountIn; i++) bars.push({ci:true, i:i, n:metroCountIn});
  chart.blocks.forEach(b=>{
    const t = parseInt(b.bars, 10);
    if(isNaN(t) || t < 1) return;
    for(let i = 1; i <= t; i++) bars.push({id:b.id, i:i, n:t});
  });
  if(!bars.some(x=>!x.ci)){ metroInfo("Nessuna battuta"); return; }
  const ctx = getAudioCtx();
  if(ctx.state === "suspended") ctx.resume();
  Object.assign(metro, { on:true, bars:bars, bar:0, beat:0, lastScroll:null, nextT:ctx.currentTime + 0.1 });
  const btn = document.getElementById("btnMetro");
  btn.textContent = "Stop"; btn.classList.add("playing");
  metro.timer = setInterval(metroTick, 25);
  metroTick();
}

function setupPWA(){
  if(window.QCD_STANDALONE) return;
  try{
    const iconUrl = "https://d1yei2z3i6k35z.cloudfront.net/11429636/67bdd0ad73993_BO_logo_2022_transp.png";
    const manifest = {
      name: "QuickChart Drummer",
      short_name: "QC Drummer",
      start_url: window.location.href,
      display: "standalone",
      background_color: "#0A0B0C",
      theme_color: "#14B8A6",
      icons: [
        { src: iconUrl, sizes: "192x192", type: "image/png" },
        { src: iconUrl, sizes: "512x512", type: "image/png" }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"});
    const manifestUrl = URL.createObjectURL(manifestBlob);
    let link = document.querySelector('link[rel="manifest"]');
    if(!link){ link = document.createElement("link"); link.rel = "manifest"; document.head.appendChild(link); }
    link.href = manifestUrl;

    function ensureMeta(name, content){
      let m = document.querySelector(`meta[name="${name}"]`);
      if(!m){ m = document.createElement("meta"); m.name = name; document.head.appendChild(m); }
      m.content = content;
    }
    ensureMeta("theme-color", "#14B8A6");
    ensureMeta("apple-mobile-web-app-capable", "yes");
    ensureMeta("mobile-web-app-capable", "yes");
    ensureMeta("apple-mobile-web-app-status-bar-style", "black-translucent");
    ensureMeta("apple-mobile-web-app-title", "QC Drummer");

    let touchIcon = document.querySelector('link[rel="apple-touch-icon"]');
    if(!touchIcon){ touchIcon = document.createElement("link"); touchIcon.rel = "apple-touch-icon"; document.head.appendChild(touchIcon); }
    touchIcon.href = iconUrl;
  }catch(e){ console.error("Errore impostazione PWA:", e); }
}

/* ============================ INIT / EVENTS ============================ */
function init(){
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  loadState();
  refreshBackupInfo();
  applyUiSize(getUiSize());
  syncViewToggle();
  renderSidebar();
  renderEditor();
  setupPWA();
  applyLogo(); cacheLogo();

  const chkPrintLight = document.getElementById("chkPrintLight");
  try{ chkPrintLight.checked = localStorage.getItem("qcd_print_light") !== "false"; }catch(e){ chkPrintLight.checked = true; }
  chkPrintLight.addEventListener("change", ()=>{
    try{ localStorage.setItem("qcd_print_light", chkPrintLight.checked ? "true" : "false"); }catch(e){}
  });

  document.getElementById("btnPrevChart").addEventListener("click", ()=>navigateChart(-1));
  document.getElementById("btnNextChart").addEventListener("click", ()=>navigateChart(1));

  document.getElementById("btnMenuToggle").addEventListener("click", openSidebar);
  document.getElementById("overlay").addEventListener("click", closeSidebar);

  document.getElementById("btnNewChart").addEventListener("click", ()=>{
    stopPlayback();
    const c = newChart();
    state.charts.push(c); state.currentId = c.id;
    saveState(); renderSidebar(); renderEditor(); closeSidebar();
  });
  document.getElementById("btnDupChart").addEventListener("click", duplicateCurrentChart);

  document.getElementById("btnExport").addEventListener("click", exportJSON);
  document.getElementById("btnImportTrigger").addEventListener("click", ()=>document.getElementById("fileImport").click());
  document.getElementById("fileImport").addEventListener("change", (e)=>{
    if(e.target.files && e.target.files[0]) importJSON(e.target.files[0]);
    e.target.value = "";
  });
  document.getElementById("btnPNGLive").addEventListener("click", exportPNG);
  document.getElementById("btnPDFLive").addEventListener("click", printChart);
  // Interruttore Modifica | La chart (presente in entrambe le viste)
  document.querySelectorAll("#viewToggle button").forEach(b=>b.addEventListener("click", ()=>{
    const isLive = qcdRoot.classList.contains("live");
    if(b.dataset.view === "chart" && !isLive) enterLive();
    else if(b.dataset.view === "edit" && isLive) exitLive();
  }));
  document.querySelectorAll(".ui-seg button").forEach(b=>b.addEventListener("click", ()=>{
    try{ localStorage.setItem("qcd_ui", b.dataset.ui); }catch(e){}
    applyUiSize(b.dataset.ui);
    if(qcdRoot.classList.contains("live")) updateChartView(); else renderEditor();
  }));
  const ciVal = document.getElementById("ciVal");
  ciVal.textContent = metroCountIn;
  const setCi = (v)=>{
    metroCountIn = Math.max(0, Math.min(8, v));
    ciVal.textContent = metroCountIn;
    try{ localStorage.setItem("qcd_countin", String(metroCountIn)); }catch(e){}
  };
  document.getElementById("ciMinus").addEventListener("click", ()=>setCi(metroCountIn - 1));
  document.getElementById("ciPlus").addEventListener("click", ()=>setCi(metroCountIn + 1));
  document.getElementById("btnMetro").addEventListener("click", ()=>{ if(metro.on) metroStop(); else metroStart(); });
  document.getElementById("btnExitLive").addEventListener("click", exitLive);

  // Play del Main Groove direttamente dalla modalità Live
  const btnPlayLive = document.getElementById("btnPlayLive");
  btnPlayLive.addEventListener("click", ()=>{
    metroStop();
    if(playbackState.playing && playbackState.activeButton === btnPlayLive){ stopPlayback(); return; }
    const chart = getCurrentChart();
    if(!chart) return;
    playMeasures(()=>{
      const c = getCurrentChart();
      return c ? { measures:c.mainGroove.measures, bpm:c.bpm, timeSig:c.timeSig, feel:c.feel } : null;
    }, btnPlayLive, "live", ()=>document.getElementById("chartView"));
  });

  // Swipe orizzontale per cambiare brano in Live
  const outer = document.getElementById("chartViewOuter");
  let touchStart = null;
  outer.addEventListener("touchstart", (e)=>{
    if(e.touches.length !== 1){ touchStart = null; return; }
    touchStart = { x:e.touches[0].clientX, y:e.touches[0].clientY };
  }, {passive:true});
  outer.addEventListener("touchend", (e)=>{
    if(!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if(Math.abs(dx) > 70 && Math.abs(dy) < 45 && Math.abs(dx) > Math.abs(dy)*2){
      navigateChart(dx < 0 ? 1 : -1);
    }
  }, {passive:true});

  let resizeTimer;
  let lastWidth = window.innerWidth;
  window.addEventListener("resize", ()=>{
    if(window.innerWidth === lastWidth) return;
    lastWidth = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      const chart = getCurrentChart();
      if(!chart) return;
      if(qcdRoot.classList.contains("live")) updateChartView();
      else renderEditor();
    }, 200);
  });
}

document.addEventListener("DOMContentLoaded", init);
})();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
